<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D46C4">
<title>VMA DocBox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Clients get one narrow column; the office gets a client rail + document ledger + review sheet. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#E3E9E6; --ink:#15201B; --muted:#5A6A63; --line:#D3DCD8;
  --accent:#1D46C4; --accent-ink:#FFFFFF; --accent-soft:#E2E8FB;
  --ok:#1B7546; --ok-soft:#DDF1E5; --warn:#9A5B00; --warn-soft:#FBEFD8; --bad:#B0281C; --bad-soft:#FBE3E0; --new:#B0381C;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Menlo,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1412; --surface:#16201C; --sunk:#1D2925; --ink:#E4ECE8; --muted:#93A49D; --line:#2A3832;
  --accent:#8EA7FF; --accent-ink:#0E1412; --accent-soft:#22305A;
  --ok:#6FD39C; --ok-soft:#173527; --warn:#F2B65A; --warn-soft:#3A2C12; --bad:#FF8A7E; --bad-soft:#41201C; --new:#FF8A6A;
  color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.45rem} h2{font-size:1.2rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.88em}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.brand .mark{font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.brand .mark b{color:var(--accent)}
.brand .firm{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.big{min-height:56px;font-size:1.02rem;font-weight:600;flex:1 1 200px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field select,.field textarea,.cell{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;min-height:42px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;cursor:pointer;font-size:.9rem;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:.8em;opacity:.7;margin-left:4px}
.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.new{background:var(--bad-soft);color:var(--new)} .pill.read{background:var(--warn-soft);color:var(--warn)}
.pill.checked{background:var(--accent-soft);color:var(--accent)} .pill.exported{background:var(--ok-soft);color:var(--ok)}
.tag{font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:1px 7px;border-radius:5px;white-space:nowrap}
.narrow{max-width:560px;margin:0 auto}
.notice{border-radius:8px;padding:10px 12px;font-size:.9rem}
.notice.warn{background:var(--warn-soft);color:var(--warn)} .notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice.ok{background:var(--ok-soft);color:var(--ok)} .notice.info{background:var(--accent-soft);color:var(--ink)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--sunk)}
.drop.over{border-color:var(--accent)}
.prog{display:flex;flex-direction:column;gap:6px}
.li{display:grid;gap:2px 12px;padding:12px 2px;border-top:1px solid var(--line);align-items:center}
.li:first-child{border-top:0}
.li .t{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{grid-column:1;font-size:.82rem;color:var(--muted)}
.li .r{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.monthhead{font-family:var(--f-display);font-weight:600;padding-top:14px}
.office{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}
.rail{position:sticky;top:76px}
.clist{display:flex;flex-direction:column;gap:2px;max-height:60vh;overflow:auto;margin-inline:-8px}
.cbtn{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:9px 10px;border-radius:8px;cursor:pointer}
.cbtn:hover{background:var(--sunk)} .cbtn[aria-current="true"]{background:var(--accent-soft)}
.cbtn .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbtn .gs{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--new);align-self:center;grid-row:1/3;grid-column:2}
.back{display:none}
@media (max-width:820px){.office{grid-template-columns:1fr}.rail{position:static}.office.has-sel .rail{display:none}.office:not(.has-sel) .detail{display:none}.back{display:inline-flex}}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--sunk)}
td.r,th.r{text-align:right}
.fn{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exportbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.veil{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(1100px,100%);height:100%;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheethead{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheetbody{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;padding:18px}
@media (max-width:820px){.sheetbody{grid-template-columns:1fr}}
.preview{background:var(--sunk);border-radius:var(--r);padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px;align-items:center}
.preview img{max-width:100%;height:auto;border-radius:4px;background:#fff}
.preview iframe{width:100%;height:70vh;border:0;border-radius:4px;background:#fff}
.preview pre{max-width:100%;overflow:auto;font-size:.75rem;margin:0;align-self:stretch}
.cell{min-height:34px;padding:5px 7px;font-size:.88rem}
.cell.n{text-align:right;font-family:var(--f-mono);width:100px}
.cell.rate{width:64px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;font-size:.9rem;max-width:calc(100% - 32px)}
details summary{cursor:pointer;font-weight:600}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px}
.tabs button{flex:1;border:0;background:transparent;border-radius:7px;padding:9px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.brand{align-items:center}
.logo{display:inline-flex;flex:none}
.ico{display:inline-flex;width:20px;height:20px;flex:none}
.ico svg{width:100%;height:100%}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:linear-gradient(135deg,var(--accent-soft),var(--surface));border:1px solid var(--line);border-radius:14px;padding:18px 20px;overflow:hidden}
.hero .art{width:150px;max-width:38vw}
.hero .art svg{width:100%;height:auto;display:block}
.hero h1{font-size:1.5rem}
.art-lg{max-width:260px;margin:0 auto;width:100%}
.art-lg svg{width:100%;height:auto;display:block}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.84rem;font-weight:600;text-align:center;color:var(--ink);min-height:84px}
.tile .ico{width:30px;height:30px;color:var(--accent)}
.tile[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tile[aria-pressed="true"] .ico{color:var(--accent-ink)}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--sunk);flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid var(--line)}
.thumb .ico{width:22px;height:22px}
.li{grid-template-columns:auto 1fr auto}
.li .thumb{grid-row:1/3}
.li .t,.li .s{grid-column:2}
.li .r{grid-column:3}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--f-display);color:#fff;flex:none;font-size:.95rem}
.cbtn{grid-template-columns:auto 1fr auto;align-items:center}
.cbtn .avatar{grid-row:1/3;width:30px;height:30px;font-size:.8rem}
.cbtn .nm,.cbtn .gs{grid-column:2}
.cbtn .dot{grid-column:3}
.docrow{display:flex;gap:10px;align-items:center;min-width:0}
.bankrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.danger{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M11 6h8l4 4v11H11z" fill="var(--accent-ink)"/><path d="M19 6l4 4h-4z" fill="var(--accent-soft)"/><path d="M14 12h6M14 15h6M14 18h4" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/><path d="M7 19h4v3h10v-3h4v7H7z" fill="var(--accent-ink)"/></svg></span><span class="mark">Doc<b>Box</b></span><span class="firm" id="firm"></span></div>
  <span class="role" id="role">Loading</span>
  <button class="btn ghost small" id="signout" type="button" hidden>Sign out</button>
</header>
<main id="main" class="narrow stack"><p class="muted">Loading…</p></main>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
